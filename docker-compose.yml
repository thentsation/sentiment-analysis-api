services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: sentiment-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '8010:8000'
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - TELVAX_LOG_FORMAT=json
      - TELVAX_RATE_LIMIT=100/min
      - TELVAX_CORS=*
