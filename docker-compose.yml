services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: sentiment-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '8010:8000'
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - LOG_LEVEL=info
      - LOG_FORMAT=json
      - WORKERS=1
      - RATE_LIMIT_PER_MINUTE=100
      - CORS_ORIGINS=["*"]
