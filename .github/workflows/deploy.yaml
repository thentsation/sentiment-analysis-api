name: Deploy

on:
  workflow_run:
    workflows: ["Docker CI/CD"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ROLE_ARN: arn:aws:iam::533267281147:role/github-actions-deploy
  ECR_REPOSITORY: sentiment-analysis-api
  GHCR_IMAGE: ghcr.io/ntsation/sentiment-analysis-api
  CONTAINER_NAME: sentiment-analysis-api

jobs:
  deploy:
    name: Deploy na EC2
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Espelhar imagem do GHCR para o ECR
        run: |
          ECR_URI="${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}"
          IMAGE_TAG="${GITHUB_SHA::12}"
          # Repositório ECR é IMMUTABLE: só publica a tag pelo SHA, nunca uma
          # tag reaproveitável como "latest".
          docker buildx imagetools create \
            --tag "$ECR_URI:$IMAGE_TAG" \
            "${{ env.GHCR_IMAGE }}:latest"
          echo "ECR_URI=$ECR_URI" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Achar a instância EC2
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=free-tier-ec2" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          [ "$INSTANCE_ID" != "None" ] || { echo "Instância não encontrada ou não está running"; exit 1; }
          echo "INSTANCE_ID=$INSTANCE_ID" >> "$GITHUB_ENV"

      - name: Deploy via SSM
        run: |
          cat > /tmp/ssm-params.json <<JSON
          {
            "commands": [
              "set -e",
              "aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin ${ECR_URI%/*}",
              "docker pull $ECR_URI:$IMAGE_TAG",
              "docker stop $CONTAINER_NAME || true",
              "docker rm $CONTAINER_NAME || true",
              "docker run -d --name $CONTAINER_NAME --restart unless-stopped -p 80:8000 $ECR_URI:$IMAGE_TAG",
              "docker image prune -f"
            ]
          }
          JSON

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy $ECR_REPOSITORY ${GITHUB_SHA::12}" \
            --parameters file:///tmp/ssm-params.json \
            --query 'Command.CommandId' --output text)
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"
          echo "Aguardando comando $COMMAND_ID na instância $INSTANCE_ID"

          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query 'Status' --output text 2>/dev/null || echo "Pending")
            echo "Status: $STATUS"
            case "$STATUS" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                  --query '{stdout:StandardOutputContent,stderr:StandardErrorContent}' --output json
                exit 1
                ;;
            esac
            sleep 5
          done
          echo "Timeout esperando o comando terminar"
          exit 1

      - name: Descobrir IP público da instância
        run: |
          PUBLIC_IP=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)
          echo "PUBLIC_IP=$PUBLIC_IP" >> "$GITHUB_ENV"

      - name: Smoke test (/health)
        run: |
          for i in $(seq 1 10); do
            CODE=$(curl -s -o /tmp/health.json -w '%{http_code}' "http://$PUBLIC_IP/health" || echo "000")
            if [ "$CODE" = "200" ]; then
              echo "OK: /health respondeu 200"
              cat /tmp/health.json
              exit 0
            fi
            echo "Tentativa $i: /health respondeu $CODE, tentando de novo em 5s"
            sleep 5
          done
          echo "Smoke test falhou: /health não respondeu 200 a tempo"
          exit 1
