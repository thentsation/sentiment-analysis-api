name: Deploy Oracle

on:
  workflow_run:
    workflows: ["Docker CI/CD"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  OCI_REGION: sa-saopaulo-1
  OCI_NAMESPACE: grun5vjqis7z
  OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
  OCIR_REPOSITORY: sentiment-analysis-api
  GHCR_IMAGE: ghcr.io/ntsation/sentiment-analysis-api
  CONTAINER_NAME: sentiment-analysis-api

jobs:
  deploy:
    name: Deploy na instância Oracle
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Instalar OCI CLI
        run: pip install --quiet oci-cli

      - name: Configurar OCI CLI
        run: |
          mkdir -p ~/.oci
          printf '%s' "${{ secrets.OCI_CI_PRIVATE_KEY }}" > ~/.oci/key.pem
          chmod 600 ~/.oci/key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${{ secrets.OCI_CI_USER_OCID }}
          fingerprint=${{ secrets.OCI_CI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=$OCI_REGION
          key_file=~/.oci/key.pem
          EOF
          chmod 600 ~/.oci/config
          echo "OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True" >> "$GITHUB_ENV"

      - name: Login no OCIR
        run: echo "${{ secrets.OCI_AUTH_TOKEN }}" | docker login gru.ocir.io -u "$OCI_NAMESPACE/ci-deploy" --password-stdin

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Espelhar imagem do GHCR para o OCIR
        run: |
          OCIR_URI="gru.ocir.io/$OCI_NAMESPACE/$OCIR_REPOSITORY"
          IMAGE_TAG="${GITHUB_SHA::12}"
          docker buildx imagetools create \
            --tag "$OCIR_URI:$IMAGE_TAG" \
            "$GHCR_IMAGE:latest"
          echo "OCIR_URI=$OCIR_URI" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Achar a instância Oracle
        run: |
          INSTANCE_ID=$(oci compute instance list \
            --compartment-id "$OCI_COMPARTMENT_ID" \
            --display-name "instance-20260824-0846" \
            --lifecycle-state RUNNING \
            --query 'data[0].id' --raw-output)
          [ "$INSTANCE_ID" != "null" ] || { echo "Instância não encontrada ou não está running"; exit 1; }
          echo "INSTANCE_ID=$INSTANCE_ID" >> "$GITHUB_ENV"

      - name: Deploy via Run Command
        run: |
          cat > /tmp/run-command-content.json <<JSON
          {
            "source": {
              "sourceType": "TEXT",
              "text": "set -e\ndocker login gru.ocir.io -u $OCI_NAMESPACE/ci-deploy -p '${{ secrets.OCI_AUTH_TOKEN }}'\ndocker pull $OCIR_URI:$IMAGE_TAG\ndocker stop $CONTAINER_NAME || true\ndocker rm $CONTAINER_NAME || true\ndocker run -d --name $CONTAINER_NAME --restart unless-stopped -p 80:8000 $OCIR_URI:$IMAGE_TAG\ndocker image prune -f"
            },
            "output": {
              "outputType": "TEXT"
            }
          }
          JSON

          COMMAND_ID=$(oci instance-agent command create \
            --compartment-id "$OCI_COMPARTMENT_ID" \
            --display-name "deploy-$OCIR_REPOSITORY-$IMAGE_TAG" \
            --target "{\"instanceId\":\"$INSTANCE_ID\"}" \
            --content file:///tmp/run-command-content.json \
            --timeout-in-seconds 120 \
            --query 'data.id' --raw-output)
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"
          echo "Aguardando comando $COMMAND_ID na instância $INSTANCE_ID"

          for i in $(seq 1 30); do
            STATE=$(oci instance-agent command-execution get --instance-id "$INSTANCE_ID" --command-id "$COMMAND_ID" --query 'data."lifecycle-state"' --raw-output 2>/dev/null || echo "PENDING")
            echo "Estado: $STATE"
            case "$STATE" in
              SUCCEEDED) exit 0 ;;
              FAILED|TIMED_OUT|CANCELED)
                oci instance-agent command-execution get --instance-id "$INSTANCE_ID" --command-id "$COMMAND_ID" \
                  --query 'data.content."{stdout: \"exit-code\"}"' 2>/dev/null || true
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Timeout esperando o comando terminar"
          exit 1

      - name: Descobrir IP público da instância
        run: |
          PUBLIC_IP=$(oci compute instance list-vnics --instance-id "$INSTANCE_ID" --query 'data[0]."public-ip"' --raw-output)
          echo "PUBLIC_IP=$PUBLIC_IP" >> "$GITHUB_ENV"

      - name: Smoke test (/health)
        run: |
          for i in $(seq 1 10); do
            CODE=$(curl -s -o /tmp/health.json -w '%{http_code}' "http://$PUBLIC_IP/health" || echo "000")
            if [ "$CODE" = "200" ]; then
              echo "OK: /health respondeu 200"
              cat /tmp/health.json
              exit 0
            fi
            echo "Tentativa $i: /health respondeu $CODE"
            sleep 5
          done
          echo "Smoke test falhou: /health não respondeu 200 a tempo"
          exit 1
