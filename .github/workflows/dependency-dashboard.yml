name: Dependency Dashboard

on:
  schedule:
    - cron: "0 12 * * 1" # segundas 09:00 BRT (UTC-3)
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read
  security-events: read

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Build dashboard body
        env:
          GH_TOKEN: ${{ secrets.DASHBOARD_PAT || secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "_Atualizado automaticamente em $(date -u +'%Y-%m-%d %H:%M UTC')._"
            echo ""
            echo "## 🔺 PRs do Dependabot aguardando revisão (major version)"
            MAJOR_PRS=$(gh pr list --repo "${{ github.repository }}" --label dependabot-major --state open --json number,title,url --jq '.[] | "- [#\(.number)](\(.url)) \(.title)"')
            if [ -z "$MAJOR_PRS" ]; then
              echo "_Nenhum PR major pendente._"
            else
              echo "$MAJOR_PRS"
            fi
            echo ""
            echo "## 🛡️ Alertas de segurança abertos (Dependabot)"
            set +e
            ALERTS=$(gh api "repos/${{ github.repository }}/dependabot/alerts?state=open" --jq '.[] | "- **\(.security_advisory.severity | ascii_upcase)** \(.security_advisory.summary) — [\(.dependency.package.name)](\(.html_url))"' 2>/tmp/alerts_err)
            ALERTS_STATUS=$?
            set -e
            if [ $ALERTS_STATUS -ne 0 ]; then
              echo "::warning::Não foi possível ler os alertas do Dependabot. Configure o secret DASHBOARD_PAT (PAT com permissão 'Dependabot alerts: read'). Detalhe: $(cat /tmp/alerts_err)" >&2
              echo "_Sem acesso aos alertas de segurança — configure o secret \`DASHBOARD_PAT\` (token com permissão \"Dependabot alerts: read\") para habilitar esta seção._"
            elif [ -z "$ALERTS" ]; then
              echo "_Nenhum alerta aberto._"
            else
              echo "$ALERTS"
            fi
          } > /tmp/dashboard-body.md

      - name: Create or update dashboard issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Dependency & Security Dashboard"
          NUM=$(gh issue list --repo "${{ github.repository }}" --search "$TITLE in:title" --state open --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n1)
          if [ -n "$NUM" ]; then
            gh issue edit "$NUM" --repo "${{ github.repository }}" --body-file /tmp/dashboard-body.md
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body-file /tmp/dashboard-body.md
          fi
