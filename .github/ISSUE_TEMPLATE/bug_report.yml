name: Bug Report
description: Reportar um problema ou comportamento inesperado
title: "fix: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Descrição
      description: O que aconteceu?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Passos para reproduzir
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamento esperado
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Versão / commit
    validations:
      required: false
